<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BG-03 — Droplets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="live-backgrounds">
    <main class="catalog-grid"><section class="demo-section" id="droplets" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Droplets</h2><div class="demo-actions"><button class="control-button" data-droplets-toggle>Pause</button><button class="control-button" data-droplets-reset>Reset</button></div></header>
            <div class="demo-stage background-stage droplets-stage" data-droplets-stage>
              <div class="droplets-capture" data-droplets-content aria-hidden="true"></div>
              <canvas class="droplets-source" data-droplets-source data-canvasui-prepainted="true" aria-hidden="true"></canvas>
              <div class="droplets-fallback" aria-hidden="true"></div>
              <canvas class="droplets-output" data-droplets-output aria-hidden="true"></canvas>
              <div class="background-overlay"><span>Atmosphere / 03</span><h3>After the rain</h3><p>Canvas UI / Droplets · move the pointer across the glass</p></div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls live-controls">
                <label><span>Intensity <output>0.78</output></span><input type="range" min="0" max="1.25" step="0.01" value="0.78" data-droplets-control="intensity" /></label>
                <label><span>Speed <output>0.72</output></span><input type="range" min="0" max="2" step="0.01" value="0.72" data-droplets-control="speed" /></label>
                <label><span>Scale <output>0.62</output></span><input type="range" min="0.1" max="1.5" step="0.01" value="0.62" data-droplets-control="scale" /></label>
                <label><span>Drop width <output>0.95</output></span><input type="range" min="0.2" max="2" step="0.01" value="0.95" data-droplets-control="dropWidth" /></label>
                <label><span>Drop length <output>1.25</output></span><input type="range" min="0.2" max="3" step="0.01" value="1.25" data-droplets-control="dropLength" /></label>
                <label><span>Refraction <output>0.35</output></span><input type="range" min="0" max="1" step="0.01" value="0.35" data-droplets-control="refraction" /></label>
                <label><span>Blur <output>1.2</output></span><input type="range" min="0" max="8" step="0.1" value="1.2" data-droplets-control="blur" /></label>
                <label><span>Vignette <output>0.3</output></span><input type="range" min="0" max="1" step="0.01" value="0.3" data-droplets-control="vignette" /></label>
                <label><span>Fall speed <output>0.8</output></span><input type="range" min="0" max="3" step="0.01" value="0.8" data-droplets-control="fallSpeed" /></label>
                <label><span>Wiggle <output>0.55</output></span><input type="range" min="0" max="3" step="0.01" value="0.55" data-droplets-control="wiggle" /></label>
                <label><span>Static drops <output>0.45</output></span><input type="range" min="0" max="2" step="0.01" value="0.45" data-droplets-control="staticDrops" /></label>
                <label><span>Wipe radius <output>0.16</output></span><input type="range" min="0.02" max="0.6" step="0.01" value="0.16" data-droplets-control="interactionRadius" /></label>
                <label><span>Wipe strength <output>0.86</output></span><input type="range" min="0" max="1" step="0.01" value="0.86" data-droplets-control="interactionStrength" /></label>
                <label><span>Wipe distortion <output>3.5</output></span><input type="range" min="0" max="8" step="0.1" value="3.5" data-droplets-control="interactionDistortion" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script type="module" src="script.js"></script>
  </body>
</html>
