<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BG-05 — Matrix</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="live-backgrounds">
    <main class="catalog-grid"><section class="demo-section" id="unicorn-matrix" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Matrix — Unicorn Studio</h2><div class="demo-actions"><button class="control-button" data-unicorn-toggle>Pause</button><button class="control-button" data-unicorn-reset>Reset</button></div></header>
            <div class="demo-stage background-stage unicorn-stage" data-unicorn-stage data-unicorn-effect="unicorn-matrix" data-unicorn-project="1bY8o6HVTI1oxJxuCJEG" data-unicorn-alt="Dark teal interactive Matrix atmosphere">
              <div class="unicorn-fallback" aria-hidden="true"></div>
              <div id="unicorn-matrix-scene" class="unicorn-scene" data-unicorn-scene aria-hidden="true"></div>
              <div class="background-overlay"><span>Atmosphere / 05</span><h3>Matrix current</h3><p>Aura C57A1CA / Unicorn Studio · move the pointer</p></div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls live-controls">
                <label><span>FPS <output>45</output></span><input type="range" min="15" max="60" step="5" value="45" data-unicorn-control="fps" /></label>
                <label><span>Render scale <output>0.75</output></span><input type="range" min="0.25" max="1" step="0.05" value="0.75" data-unicorn-control="scale" /></label>
                <label><span>DPI <output>1</output></span><input type="range" min="0.5" max="2" step="0.1" value="1" data-unicorn-control="dpi" /></label>
                <label><span>Opacity <output>1</output></span><input type="range" min="0.2" max="1" step="0.05" value="1" data-unicorn-control="opacity" /></label>
                <label><span>Saturation <output>1</output></span><input type="range" min="0" max="2" step="0.05" value="1" data-unicorn-control="saturation" /></label>
                <label><span>Blur <output>0px</output></span><input type="range" min="0" max="12" step="0.5" value="0" data-unicorn-control="blur" data-suffix="px" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
