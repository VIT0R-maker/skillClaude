<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BG-07 — Gradient field</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="live-backgrounds">
    <main class="catalog-grid"><section class="demo-section" id="gradient-field" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Gradient field — Unicorn Studio</h2><div class="demo-actions"><button class="control-button" data-unicorn-toggle>Pause</button><button class="control-button" data-unicorn-reset>Reset</button></div></header>
            <div class="demo-stage background-stage unicorn-stage gradient-field-stage" data-unicorn-stage data-unicorn-effect="gradient-field" data-unicorn-project="BhoqrigscYbD7NN1fwcp" data-unicorn-alt="Interactive blue and purple gradient field">
              <div class="unicorn-fallback gradient-field-fallback" aria-hidden="true"></div>
              <div id="unicorn-gradient-field-scene" class="unicorn-scene" data-unicorn-scene aria-hidden="true"></div>
              <div class="background-overlay"><span>Atmosphere / 07</span><h3>Gradient field</h3><p>Aura 83B363C / Unicorn Studio · move the pointer</p></div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls live-controls">
                <label><span>FPS <output>45</output></span><input type="range" min="15" max="60" step="5" value="45" data-unicorn-control="fps" /></label>
                <label><span>Render scale <output>0.75</output></span><input type="range" min="0.25" max="1" step="0.05" value="0.75" data-unicorn-control="scale" /></label>
                <label><span>DPI <output>1</output></span><input type="range" min="0.5" max="2" step="0.1" value="1" data-unicorn-control="dpi" /></label>
                <label><span>Brightness <output>1</output></span><input type="range" min="0.4" max="2" step="0.05" value="1" data-unicorn-control="brightness" /></label>
                <label><span>Saturation <output>1</output></span><input type="range" min="0" max="2" step="0.05" value="1" data-unicorn-control="saturation" /></label>
                <label><span>Hue <output>0deg</output></span><input type="range" min="-180" max="180" step="5" value="0" data-unicorn-control="hue" data-suffix="deg" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
