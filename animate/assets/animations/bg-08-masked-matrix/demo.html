<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BG-08 — Masked Matrix</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="live-backgrounds">
    <main class="catalog-grid"><section class="demo-section" id="masked-matrix" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Masked Matrix — Unicorn Studio</h2><div class="demo-actions"><button class="control-button" data-unicorn-toggle>Pause</button><button class="control-button" data-unicorn-reset>Reset</button></div></header>
            <div class="demo-stage background-stage unicorn-stage masked-matrix-stage" data-unicorn-stage data-unicorn-effect="masked-matrix" data-unicorn-project="XxCmD31vVBmiINgvYCho" data-unicorn-alt="Interactive blue Matrix atmosphere with a bottom fade">
              <div class="unicorn-fallback masked-matrix-fallback" aria-hidden="true"></div>
              <div id="unicorn-masked-matrix-scene" class="unicorn-scene" data-unicorn-scene aria-hidden="true"></div>
              <div class="background-overlay"><span>Atmosphere / 08</span><h3>Masked Matrix</h3><p>Aura 8E9C3 / Unicorn Studio · move the pointer</p></div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls live-controls">
                <label><span>FPS <output>45</output></span><input type="range" min="15" max="60" step="5" value="45" data-unicorn-control="fps" /></label>
                <label><span>Render scale <output>0.75</output></span><input type="range" min="0.25" max="1" step="0.05" value="0.75" data-unicorn-control="scale" /></label>
                <label><span>DPI <output>1</output></span><input type="range" min="0.5" max="2" step="0.1" value="1" data-unicorn-control="dpi" /></label>
                <label><span>Fade start <output>80%</output></span><input type="range" min="35" max="100" step="1" value="80" data-unicorn-control="maskStart" data-suffix="%" /></label>
                <label><span>Brightness <output>1</output></span><input type="range" min="0.4" max="2" step="0.05" value="1" data-unicorn-control="brightness" /></label>
                <label><span>Saturation <output>1</output></span><input type="range" min="0" max="2" step="0.05" value="1" data-unicorn-control="saturation" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
