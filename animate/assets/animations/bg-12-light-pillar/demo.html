<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BG-12 — Light pillar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="live-backgrounds">
    <main class="catalog-grid"><section class="demo-section" id="light-pillar" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>React Bits Light Pillar</h2><div class="demo-actions"><button class="control-button" data-light-pillar-toggle>Pause</button><button class="control-button" data-light-pillar-reset>Reset</button></div></header>
            <div class="demo-stage background-stage light-pillar-stage" data-light-pillar-stage>
              <div class="light-pillar-fallback" aria-hidden="true"></div>
              <canvas data-light-pillar-canvas aria-hidden="true"></canvas>
              <div class="background-overlay"><span>Atmosphere / 12</span><h3>Light Pillar</h3><p>React Bits · vanilla WebGL2 · move the pointer</p></div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls live-controls">
                <label><span>Rotation speed <output>0.3</output></span><input type="range" min="0" max="2" step="0.05" value="0.3" data-light-pillar-control="rotationSpeed" /></label>
                <label><span>Intensity <output>1</output></span><input type="range" min="0.1" max="2.5" step="0.05" value="1" data-light-pillar-control="intensity" /></label>
                <label><span>Glow <output>0.005</output></span><input type="range" min="0.001" max="0.02" step="0.001" value="0.005" data-light-pillar-control="glow" /></label>
                <label><span>Pillar width <output>3</output></span><input type="range" min="0.5" max="8" step="0.1" value="3" data-light-pillar-control="width" /></label>
                <label><span>Pillar height <output>0.4</output></span><input type="range" min="0.1" max="1.5" step="0.05" value="0.4" data-light-pillar-control="height" /></label>
                <label><span>Noise <output>0.5</output></span><input type="range" min="0" max="2" step="0.05" value="0.5" data-light-pillar-control="noise" /></label>
                <label><span>Pillar rotation <output>0deg</output></span><input type="range" min="-90" max="90" step="1" value="0" data-light-pillar-control="pillarRotation" data-suffix="deg" /></label>
                <label><span>Palette shift <output>0deg</output></span><input type="range" min="-180" max="180" step="5" value="0" data-light-pillar-control="palette" data-suffix="deg" /></label>
                <label><span>Opacity <output>1</output></span><input type="range" min="0" max="1" step="0.05" value="1" data-light-pillar-control="opacity" /></label>
                <label><span>Interaction <output>On</output></span><input type="range" min="0" max="1" step="1" value="1" data-light-pillar-control="interactive" /></label>
                <label><span>Quality <output>High</output></span><input type="range" min="0" max="2" step="1" value="2" data-light-pillar-control="quality" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
