<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INT-04 — Option wheel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="component-motion">
    <main class="catalog-grid"><section class="demo-section" id="option-wheel" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>React Bits Option Wheel</h2><div class="demo-actions"><button class="control-button" data-option-wheel-reset>Reset</button></div></header>
            <div class="demo-stage option-wheel-stage">
              <div class="option-wheel" data-option-wheel role="listbox" tabindex="0" aria-label="Music style option wheel">
                <span class="option-wheel-centerline" aria-hidden="true"></span>
                <button class="option-wheel-item" id="option-wheel-item-0" type="button" role="option" tabindex="-1" data-option-wheel-item>Ambient</button>
                <button class="option-wheel-item" id="option-wheel-item-1" type="button" role="option" tabindex="-1" data-option-wheel-item>House</button>
                <button class="option-wheel-item" id="option-wheel-item-2" type="button" role="option" tabindex="-1" data-option-wheel-item>Techno</button>
                <button class="option-wheel-item" id="option-wheel-item-3" type="button" role="option" tabindex="-1" data-option-wheel-item>Jazz</button>
                <button class="option-wheel-item" id="option-wheel-item-4" type="button" role="option" tabindex="-1" data-option-wheel-item>Lo-Fi</button>
                <button class="option-wheel-item" id="option-wheel-item-5" type="button" role="option" tabindex="-1" data-option-wheel-item>Synthwave</button>
                <button class="option-wheel-item" id="option-wheel-item-6" type="button" role="option" tabindex="-1" data-option-wheel-item>Trance</button>
                <button class="option-wheel-item" id="option-wheel-item-7" type="button" role="option" tabindex="-1" data-option-wheel-item>Funk</button>
                <button class="option-wheel-item" id="option-wheel-item-8" type="button" role="option" tabindex="-1" data-option-wheel-item>Disco</button>
                <button class="option-wheel-item" id="option-wheel-item-9" type="button" role="option" tabindex="-1" data-option-wheel-item>Hip-Hop</button>
                <button class="option-wheel-item" id="option-wheel-item-10" type="button" role="option" tabindex="-1" data-option-wheel-item>Chillwave</button>
                <button class="option-wheel-item" id="option-wheel-item-11" type="button" role="option" tabindex="-1" data-option-wheel-item>Drum &amp; Bass</button>
                <div class="option-wheel-readout" aria-live="polite"><small>Selected</small><strong data-option-wheel-selected>Jazz</strong><span>Scroll · drag · arrow keys</span></div>
              </div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls option-wheel-controls">
                <label><span>Font size <output>3rem</output></span><input type="range" min="1" max="4" step="0.1" value="3" data-option-wheel-control="fontSize" data-suffix="rem" /></label>
                <label><span>Spacing <output>1.4</output></span><input type="range" min="0.7" max="2.4" step="0.1" value="1.4" data-option-wheel-control="spacing" /></label>
                <label><span>Curve <output>1</output></span><input type="range" min="0" max="2.5" step="0.05" value="1" data-option-wheel-control="curve" /></label>
                <label><span>Tilt <output>6deg</output></span><input type="range" min="0" max="18" step="0.5" value="6" data-option-wheel-control="tilt" data-suffix="deg" /></label>
                <label><span>Blur <output>2px</output></span><input type="range" min="0" max="6" step="0.1" value="2" data-option-wheel-control="blur" data-suffix="px" /></label>
                <label><span>Fade <output>0.25</output></span><input type="range" min="0" max="0.8" step="0.05" value="0.25" data-option-wheel-control="fade" /></label>
                <label><span>Min opacity <output>0.05</output></span><input type="range" min="0" max="0.5" step="0.05" value="0.05" data-option-wheel-control="minOpacity" /></label>
                <label><span>Smoothing <output>200ms</output></span><input type="range" min="20" max="800" step="10" value="200" data-option-wheel-control="smoothing" data-suffix="ms" /></label>
                <label><span>Inset <output>80px</output></span><input type="range" min="20" max="180" step="5" value="80" data-option-wheel-control="inset" data-suffix="px" /></label>
                <label><span>Side <output>Left</output></span><input type="range" min="0" max="1" step="1" value="0" data-option-wheel-control="side" /></label>
                <label><span>Loop <output>Off</output></span><input type="range" min="0" max="1" step="1" value="0" data-option-wheel-control="loop" /></label>
                <label><span>Draggable <output>On</output></span><input type="range" min="0" max="1" step="1" value="1" data-option-wheel-control="draggable" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
