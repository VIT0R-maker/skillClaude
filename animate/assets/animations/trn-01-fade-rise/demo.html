<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRN-01 — Fade rise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="entrances">
    <main class="catalog-grid"><section class="demo-section" id="fade-rise" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Fade rise</h2><button class="control-button" data-replay="fade-rise">Replay</button></header>
            <div class="demo-stage"><div class="entrance-ui" data-entrance="fade-rise"><p class="micro-label">New release · 4.2</p><h3>Interfaces com<br />uma nova cadência.</h3><p>Transforme sinais discretos em uma narrativa visual clara.</p><span class="fake-action">Explore the system</span></div></div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls">
                <label><span>Duration <output>720ms</output></span><input type="range" min="240" max="1600" step="20" value="720" data-motion-control="duration" data-suffix="ms" /></label>
                <label><span>Distance <output>28px</output></span><input type="range" min="0" max="80" step="2" value="28" data-motion-control="distance" data-suffix="px" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
