<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRN-02 — Clip reveal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="entrances">
    <main class="catalog-grid"><section class="demo-section" id="clip-reveal" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Clip reveal</h2><button class="control-button" data-replay="clip-reveal">Replay</button></header>
            <div class="demo-stage"><div class="clip-title" data-entrance="clip-reveal"><span>Signal.</span><span>Structure.</span><span>Motion.</span></div></div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls">
                <label><span>Duration <output>840ms</output></span><input type="range" min="240" max="1600" step="20" value="840" data-motion-control="duration" data-suffix="ms" /></label>
                <label><span>Stagger <output>90ms</output></span><input type="range" min="0" max="300" step="10" value="90" data-motion-control="stagger" data-suffix="ms" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
