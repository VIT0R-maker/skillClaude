<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRN-03 — Blur scale</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="entrances">
    <main class="catalog-grid"><section class="demo-section" id="blur-scale" data-section>
          <div class="demo-card">
            <header class="demo-card-bar"><h2>Blur scale</h2><button class="control-button" data-replay="blur-scale">Replay</button></header>
            <div class="demo-stage"><div class="blur-grid" data-entrance="blur-scale"><article><span>01 / Focus</span><h3>Capture</h3><p>Observe o sinal.</p></article><article><span>02 / Model</span><h3>Shape</h3><p>Organize o sistema.</p></article><article><span>03 / Move</span><h3>Animate</h3><p>Dê vida à resposta.</p></article></div></div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls">
                <label><span>Duration <output>640ms</output></span><input type="range" min="240" max="1600" step="20" value="640" data-motion-control="duration" data-suffix="ms" /></label>
                <label><span>Blur <output>14px</output></span><input type="range" min="0" max="30" step="1" value="14" data-motion-control="blur" data-suffix="px" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script src="script.js"></script>
  </body>
</html>
