<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRN-04 — Particle scroll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="entrances">
    <main class="catalog-grid"><section class="demo-section" id="particle-scroll" data-section>
          <div class="demo-card particle-scroll-card">
            <header class="demo-card-bar"><h2>Particle scroll</h2><button class="control-button" data-particle-scroll-replay>Replay</button></header>
            <div class="demo-stage particle-scroll-stage" data-particle-scroll-stage>
              <canvas class="particle-scroll-source" data-particle-scroll-source data-canvasui-prepainted="true" aria-hidden="true"></canvas>
              <div class="particle-scroll-content" data-particle-scroll-content tabindex="0" aria-label="Role para experimentar o efeito Particle Scroll">
                <div class="particle-scroll-document">
                  <article><span>01</span><strong>Fragments find their place.</strong></article>
                  <article><span>02</span><strong>Signal becomes structure.</strong></article>
                  <article><span>03</span><strong>Motion resolves into form.</strong></article>
                </div>
              </div>
              <div class="particle-scroll-fallback" aria-hidden="true"></div>
              <canvas class="particle-scroll-output" data-particle-scroll-output aria-hidden="true"></canvas>
              <div class="particle-scroll-guide" aria-hidden="true"><span>formation line</span></div>
            </div>
            <details class="parameter-panel">
              <summary>Parameters</summary>
              <div class="motion-controls particle-scroll-controls">
                <label><span>Point <output>0.6</output></span><input type="range" min="0.1" max="0.95" step="0.01" value="0.6" data-particle-scroll-control="point" /></label>
                <label><span>Band <output>150px</output></span><input type="range" min="40" max="500" step="10" value="150" data-particle-scroll-control="band" data-suffix="px" /></label>
                <label><span>Density <output>2.4px</output></span><input type="range" min="1" max="8" step="0.1" value="2.4" data-particle-scroll-control="density" data-suffix="px" /></label>
                <label><span>Particle size <output>1.4px</output></span><input type="range" min="0.5" max="5" step="0.1" value="1.4" data-particle-scroll-control="size" data-suffix="px" /></label>
                <label><span>Spread <output>110px</output></span><input type="range" min="0" max="320" step="5" value="110" data-particle-scroll-control="spread" data-suffix="px" /></label>
                <label><span>Gravity <output>0.35</output></span><input type="range" min="-1" max="1" step="0.05" value="0.35" data-particle-scroll-control="gravity" /></label>
                <label><span>Drift <output>0.55</output></span><input type="range" min="0" max="1" step="0.01" value="0.55" data-particle-scroll-control="drift" /></label>
                <label><span>Swirl <output>44px</output></span><input type="range" min="0" max="160" step="2" value="44" data-particle-scroll-control="swirl" data-suffix="px" /></label>
                <label><span>Stagger <output>0.68</output></span><input type="range" min="0" max="0.95" step="0.01" value="0.68" data-particle-scroll-control="stagger" /></label>
                <label><span>Fade <output>0.86</output></span><input type="range" min="0" max="1" step="0.01" value="0.86" data-particle-scroll-control="fade" /></label>
                <label><span>Settle <output>0.8s</output></span><input type="range" min="0.05" max="3" step="0.05" value="0.8" data-particle-scroll-control="settle" data-suffix="s" /></label>
                <label><span>Smoothing <output>0.3s</output></span><input type="range" min="0" max="1.5" step="0.05" value="0.3" data-particle-scroll-control="smoothing" data-suffix="s" /></label>
              </div>
            </details>
          </div>
        </section></main>
    <script type="module" src="script.js"></script>
  </body>
</html>
